name: Make It

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r source/requirements.txt

      - name: Build Windows Binary
        run: |
          pyinstaller --noconfirm --onefile --console --name "make_it_win" source/make_it.py

      - name: Organize output
        run: |
          mkdir -p download
          cp dist/make_it_win.exe download/make_it_win.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: make_it_win.exe
          path: download/make_it_win.exe

  build-linux:
