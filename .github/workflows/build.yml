name: Make It

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  # =========================
  # WINDOWS BUILD
  # =========================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r source/requirements.txt

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name make_it_win source/make_it.py

      - name: Prepare download directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path download

      - name: Copy Windows executable
        shell: pwsh
        run: |
          Copy-Item dist/make_it_win.exe download/make_it_win.exe -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: make-it-windows
          path: download/make_it_win.exe


  # =========================
  # MACOS BUILD
  # =========================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r source/requirements.txt

      - name: Build macOS executable
        run: |
          pyinstaller --onefile --name make_it_mac source/make_it.py

      - name: Prepare download directory
        run: |
          mkdir -p download

      - name: Copy macOS executable
        run: |
          cp dist/make_it_mac download/make_it_mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: make-it-macos
          path: download/make_it_mac
